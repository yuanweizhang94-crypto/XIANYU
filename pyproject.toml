[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xianyu-system"
version = "0.1.0"
description = "XIANYU repository governance baseline"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "XIANYU maintainers" }]
dependencies = [
  "PyYAML>=6.0.0",
  "jsonschema>=4.0.0",
  "fastapi>=0.115,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "apscheduler>=3.11,<4.0",
  "jinja2>=3.1,<4.0",
  "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  "httpx>=0.28,<1.0",
]

[tool.setuptools.packages.find]
where = ["app"]
include = ["xianyu_system*"]

[tool.pytest.ini_options]
testpaths = ["tests", "changes/active"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
