name: Fetch Exact Pixabay Audio URLs

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fetch_exact_pixabay_audio_urls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install media validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download exact original Pixabay MP3 files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exact_pixabay_audio
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          curl -fL --retry 5 -A "$UA" -e 'https://pixabay.com/music/corporate-the-technology-corporate-198151/' \
            -o exact_pixabay_audio/bgm_the_technology_corporate_198151.mp3 \
            'https://cdn.pixabay.com/download/audio/2024/03/25/audio_5bfd7d0327.mp3?filename=momotmusic-the-technology-corporate-198151.mp3'
          curl -fL --retry 5 -A "$UA" -e 'https://pixabay.com/sound-effects/film-special-effects-whoosh-effect-382717/' \
            -o exact_pixabay_audio/whoosh_effect_382717.mp3 \
            'https://cdn.pixabay.com/download/audio/2025/07/30/audio_9b5f822de1.mp3?filename=dragon-studio-whoosh-effect-382717.mp3'
          curl -fL --retry 5 -A "$UA" -e 'https://pixabay.com/sound-effects/film-special-effects-ding-402325/' \
            -o exact_pixabay_audio/ding_402325.mp3 \
            'https://cdn.pixabay.com/download/audio/2025/09/09/audio_2556e69436.mp3?filename=dragon-studio-ding-402325.mp3'
          curl -fL --retry 5 -A "$UA" -e 'https://pixabay.com/sound-effects/technology-ui-notification-pop-513564/' \
            -o exact_pixabay_audio/ui_notification_pop_513564.mp3 \
            'https://cdn.pixabay.com/download/audio/2026/04/09/audio_d5e1301b98.mp3?filename=soundshelfstudio-ui-notification-pop-513564.mp3'

          for f in exact_pixabay_audio/*.mp3; do
            file "$f" | tee -a exact_pixabay_audio/VALIDATION.txt
            format=$(ffprobe -v error -show_entries format=format_name -of csv=p=0 "$f")
            duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            size=$(stat -c %s "$f")
            echo "$f format=$format duration=$duration size=$size" | tee -a exact_pixabay_audio/VALIDATION.txt
            test "$size" -gt 20000
            python3 - "$duration" <<'PY'
import sys
assert float(sys.argv[1]) > 0.1
PY
            case "$format" in *mp3*) ;; *) echo "Not MP3: $f ($format)"; exit 1;; esac
          done
          sha256sum exact_pixabay_audio/*.mp3 > exact_pixabay_audio/SHA256SUMS.txt
          cat > exact_pixabay_audio/SOURCES.tsv <<'EOF'
bgm_the_technology_corporate_198151.mp3	The Technology Corporate — MomotMusic	https://pixabay.com/music/corporate-the-technology-corporate-198151/
whoosh_effect_382717.mp3	Whoosh Effect — DRAGON-STUDIO	https://pixabay.com/sound-effects/film-special-effects-whoosh-effect-382717/
ding_402325.mp3	Ding — DRAGON-STUDIO	https://pixabay.com/sound-effects/film-special-effects-ding-402325/
ui_notification_pop_513564.mp3	UI Notification Pop — SoundShelfStudio	https://pixabay.com/sound-effects/technology-ui-notification-pop-513564/
EOF
      - uses: actions/upload-artifact@v4
        with:
          name: ghana-exact-pixabay-audio
          path: exact_pixabay_audio/
          if-no-files-found: error
          retention-days: 7
