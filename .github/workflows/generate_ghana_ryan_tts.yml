name: Generate Ghana Ryan TTS

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/generate_ghana_ryan_tts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install online Edge TTS client
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts

      - name: Generate Microsoft en-GB-RyanNeural voice tracks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output

          declare -a texts=(
            "Looking for a high-margin... canned fish supplier in Africa?"
            "Partner directly... with China's leading production factory."
            "We select fresh sardines and mackerel, with strict quality control."
            "Full cans, firm fish, and a steady supply... for your wholesale orders."
            "Full support for O E M... and private label customization... to build your own brand."
            "Premium quality products, ready for large-scale distribution... in Ghana and Kenya."
            "Contact us now for direct prices, get our wholesale catalog, and ask for free samples today!"
          )

          for i in "${!texts[@]}"; do
            n=$((i+1))
            printf -v idx "%02d" "$n"
            edge-tts \
              --voice en-GB-RyanNeural \
              --rate=-8% \
              --pitch=+0Hz \
              --volume=+0% \
              --text "${texts[$i]}" \
              --write-media "output/${idx}_ryan.mp3" \
              --write-subtitles "output/${idx}_ryan.srt"
          done

          cat > output/manifest.txt <<'EOF'
          Voice: Microsoft Edge online neural TTS
          Voice ID: en-GB-RyanNeural
          Rate: -8%
          Pitch: 0 Hz
          Volume: 0%
          Segments:
          01 00:00.0-00:03.0 Looking for a high-margin... canned fish supplier in Africa?
          02 00:03.0-00:07.0 Partner directly... with China's leading production factory.
          03 00:07.0-00:11.0 We select fresh sardines and mackerel, with strict quality control.
          04 00:11.0-00:15.0 Full cans, firm fish, and a steady supply... for your wholesale orders.
          05 00:15.0-00:19.0 Full support for OEM... and private label customization... to build your own brand.
          06 00:19.0-00:24.0 Premium quality products, ready for large-scale distribution... in Ghana and Kenya.
          07 00:24.0-00:30.0 Contact us now for direct prices, get our wholesale catalog, and ask for free samples today!
          EOF

      - name: Upload cloud-generated voice tracks
        uses: actions/upload-artifact@v4
        with:
          name: ghana-ryan-neural-tts
          path: output/
          if-no-files-found: error
          retention-days: 7
