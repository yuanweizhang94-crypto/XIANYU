name: quality

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .[dev]
      - name: Ruff check
        run: ruff check .
      - name: Mypy check
        run: mypy scripts app
      - name: Repository and change validation
        run: |
          python scripts/validate_change.py
          python scripts/detect_duplicate_capabilities.py
