name: Generate Ghana Ryan TTS 28s

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/generate_ghana_ryan_tts_28s.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Edge TTS
        run: python -m pip install --upgrade edge-tts
      - name: Generate exact Ryan voice lines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          declare -a texts=(
            "Looking for a direct canned fish factory in China?"
            "Partner directly with China's leading production factory."
            "We select fresh sardines and mackerel, under strict quality control."
            "Full cans, firm fish, and a steady supply for your bulk orders."
            "Full support for O E M and private label customization, to build your own brand."
            "Premium quality products, ready for large-scale distribution across Africa."
            "Contact us now for direct prices, and ask for free samples today!"
          )
          for i in "${!texts[@]}"; do
            n=$((i+1)); printf -v idx "%02d" "$n"
            edge-tts --voice en-GB-RyanNeural --rate=-5% --pitch=+0Hz --volume=+0% \
              --text "${texts[$i]}" \
              --write-media "output/${idx}_ryan.mp3" \
              --write-subtitles "output/${idx}_ryan.srt"
          done
          cat > output/manifest.txt <<'EOF'
          Voice provider: Microsoft Edge online neural TTS
          Voice ID: en-GB-RyanNeural
          Rate: -5% (approximately 0.95x)
          Pitch: 0 Hz
          Timeline windows: 3,3,3,4,4,5,6 seconds (28 seconds total)
          EOF
      - name: Upload Ryan tracks
        uses: actions/upload-artifact@v4
        with:
          name: ghana-ryan-neural-tts-28s
          path: output/
          if-no-files-found: error
          retention-days: 7
