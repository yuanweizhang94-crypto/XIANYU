name: tests

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .[dev]
      - name: Run pytest
        run: pytest
      - name: Verify repository
        run: python scripts/verify_repository.py
